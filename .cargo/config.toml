[build]
# Default target stays native; CI overrides as needed.

# Linux native: clang + mold linker. mold is 2-5x faster at linking than ld.
# Required to be installed (provided by the dev container).
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[term]
color = "auto"
