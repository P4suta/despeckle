name: despeckle

services:
  dev:
    # CI publishes the prebuilt dev image to ghcr.io (.github/workflows/dev-image.yml).
    # `docker compose pull` retrieves it; `docker compose build` falls back to a
    # local build for Dockerfile iteration.
    image: ghcr.io/p4suta/despeckle-dev:latest
    build:
      context: .
      args:
        USER_UID: "${UID:-1000}"
        USER_GID: "${GID:-1000}"
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      INSIDE_CONTAINER: "1"
      GRADLE_USER_HOME: /workspace/.gradle-home
      DESPECKLE_LOG: "${DESPECKLE_LOG:-info}"
    volumes:
      # Bind-mount the whole repo, so GRADLE_USER_HOME (/workspace/.gradle-home)
      # lands in the host-owned ./.gradle-home (git-ignored). A named volume
      # here would be created root-owned, and a non-root `docker compose run`
      # could not write the wrapper lock/dist into it — the failure surfaces as
      # "Could not create parent directory for lock file" / "Invalid or corrupt
      # jarfile", which is exactly what broke the git hooks.
      - .:/workspace:cached
    init: true
    stdin_open: true
    tty: true
