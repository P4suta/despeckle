# Build Javadoc and deploy to GitHub Pages on every successful push to main.

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (javadoc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@6e9ec90e74cee72fbe9966c3ea7d35d9e094f3e3 # v5.0.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@0bd25d83f48d77c63dc89bfbf9ca432dc0af6b85 # v5.0.0
      # `javadoc` only parses source; it does not load Leptonica, so the native
      # library is not needed here (unlike the test job in ci.yml).
      - run: ./gradlew javadoc --no-daemon -Dorg.gradle.java.installations.auto-download=false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs/javadoc

  deploy:
    name: deploy (gh-pages)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
