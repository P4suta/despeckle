# despeckle CI.
#
# Policy:
#   - No `on: schedule`. Dependabot is the only scheduled job.
#   - Every action is SHA-pinned; Dependabot bumps weekly.
#   - Linux-only — despeckle is built and run on Linux.
#   - The runners are bare ubuntu-latest (not the dev image), so the Java
#     toolchain and the Leptonica native library are installed per job.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Leptonica is loaded at run time by the FFM layer, so the native library
      # must be present on the runner for the tests.
      - name: install Leptonica
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libleptonica-dev
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v5.0.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v5.0.0
      # `build` runs the entire quality gate: Error Prone (compileJava),
      # Spotless (spotlessCheck), SpotBugs (spotbugsMain/Test) and the JUnit
      # suite. Toolchain auto-download is off; the setup-java JDK is used.
      - run: ./gradlew build --no-daemon -Dorg.gradle.java.installations.auto-download=false
      - name: upload reports on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/

  lint-peripheral:
    name: lint (yaml / json / spell / actions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: crate-ci/typos@f8a58b6b53f2279f71eb605f03a4ae4d10608f45 # v1.47.0
      - name: install biome + yamlfmt + actionlint
        run: |
          curl -fsSL "https://github.com/biomejs/biome/releases/latest/download/biome-linux-x64" \
            -o /usr/local/bin/biome
          sudo chmod +x /usr/local/bin/biome
          YAMLFMT_VERSION=0.13.0
          curl -fsSL "https://github.com/google/yamlfmt/releases/download/v${YAMLFMT_VERSION}/yamlfmt_${YAMLFMT_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin yamlfmt
          ACTIONLINT_VERSION=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin actionlint
      - run: biome format .
      - run: yamlfmt --lint .
      - run: actionlint -color
