# despeckle CI.
#
# Policy:
#   - No `on: schedule` in this workflow. The only scheduled jobs are Dependabot
#     and tool-freshness.yml (which checks the Dockerfile's ARG-pinned tools).
#   - Every action is SHA-pinned; Dependabot bumps weekly.
#   - Linux-only — despeckle is built and run on Linux.
#   - The runners are bare ubuntu-latest (not the dev image), so the Java
#     toolchain and the Leptonica native library are installed per job.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Leptonica is loaded at run time by the FFM layer, so the native library
      # must be present on the runner for the tests. libwebp (cwebp + img2webp)
      # lets the report tests exercise the real WebP encode path instead of the
      # PNG fallback — keeping the dev image (Dockerfile) and CI in step.
      - name: install Leptonica + libwebp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libleptonica-dev webp
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "25"
      # `cache-provider: basic` selects v6.1.0's MIT/open-source cache provider
      # (@actions/cache) over the default `enhanced`, which loads the proprietary,
      # non-MIT `gradle-actions-caching` component governed by Gradle's separate ToS.
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
      # `build` runs the entire quality gate: Error Prone (compileJava),
      # Spotless (spotlessCheck), SpotBugs (spotbugsMain/Test) and the JUnit
      # suite. Toolchain auto-download is off; the setup-java JDK is used.
      - run: ./gradlew build --no-daemon -Dorg.gradle.java.installations.auto-download=false
      - name: upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/

  lint-peripheral:
    name: lint (yaml / json / toml / spell / actions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
      # Versions pinned to match the dev image (Dockerfile) so CI and the
      # container can never check formatting with different tool versions.
      - name: install biome + taplo + yamlfmt + actionlint
        run: |
          BIOME_VERSION=2.4.16
          curl -fsSL "https://github.com/biomejs/biome/releases/download/@biomejs/biome@${BIOME_VERSION}/biome-linux-x64" \
            -o /usr/local/bin/biome
          sudo chmod +x /usr/local/bin/biome
          TAPLO_VERSION=0.9.3
          curl -fsSL "https://github.com/tamasfe/taplo/releases/download/${TAPLO_VERSION}/taplo-linux-x86_64.gz" \
            | gunzip | sudo tee /usr/local/bin/taplo > /dev/null
          sudo chmod +x /usr/local/bin/taplo
          YAMLFMT_VERSION=0.13.0
          curl -fsSL "https://github.com/google/yamlfmt/releases/download/v${YAMLFMT_VERSION}/yamlfmt_${YAMLFMT_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin yamlfmt
          ACTIONLINT_VERSION=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin actionlint
      - run: biome format .
      - run: taplo fmt --check
      - run: yamlfmt --lint .
      - run: actionlint -color

  rewrite-advisory:
    name: openrewrite (advisory, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory only: this job must never fail the workflow. The blocking gate is
    # the `build` job; OpenRewrite stays out of it by design (build.gradle.kts +
    # rewrite.yml). rewriteDryRun parses sources only, so no Leptonica is needed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "25"
      # MIT/open-source cache provider — see the note in the `build` job above.
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
      # Emits the proposed patch to build/reports/rewrite/rewrite.patch and exits
      # 0 even with suggestions, so the job is informational; the upload makes the
      # patch one click away on every PR.
      - run: ./gradlew rewriteDryRun --no-daemon -Dorg.gradle.java.installations.auto-download=false
      - name: upload rewrite patch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rewrite-patch
          path: build/reports/rewrite/rewrite.patch
          # warn (not ignore) so a dry-run that crashed before writing the patch is
          # visible as an annotation, even though the job is non-blocking.
          if-no-files-found: warn
