# Auto-merge Dependabot PRs once required CI passes.
#
# Policy:
#   - `patch` and `minor` bumps: enable auto-merge (squash). GitHub holds the PR
#     until main's required checks (build + lint) are green, then merges it.
#   - `major` bumps: skip — leave for manual review since they often need
#     code adaptation.
#
# main's branch protection requires green CI, not approvals, so there is no
# separate approve step; that protection is what makes `--auto` wait for checks
# instead of merging immediately.

name: dependabot-auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: enable auto-merge (patch / minor only)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
