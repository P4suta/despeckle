# Disable Gradle's file-system watching for this repo.
#
# Every recipe runs Gradle with --no-daemon (the dev container is ephemeral), so VFS
# watching — whose only payoff is a warm file snapshot carried across daemon reuses —
# buys nothing here, while watching across a Docker bind mount is a known fragility.
# Turning it off is free hygiene; CI (single-shot, no daemon reuse) is unaffected.
#
# Context: if the .gradle cache ever records the mount's *host* source path
# (…/despeckle) instead of the in-container mount point (/workspace) — e.g. after a
# build is killed mid-write — Spotless rejects build.gradle.kts with "All target
# files must be within the project dir". `just reset-cache` is the cure (clears
# .gradle); disabling watching reduces the chance of that state forming.
org.gradle.vfs.watch=false
